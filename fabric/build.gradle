plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        // Optional for spawn testing: ./gradlew :fabric:runClient -PspawnWeight=500
        if (project.hasProperty('spawnWeight')) {
            configureEach { vmArg("-Dstonegolem.spawnWeight=${project.property('spawnWeight')}") }
        }
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        // Headless game-test server: ./gradlew :fabric:runGametest
        gametest {
            server()
            setConfigName('Fabric Game Test')
            ideConfigGenerated(true)
            vmArg('-Dfabric-api.gametest')
            vmArg("-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest/junit.xml")
            runDir('runs/gametest')
        }
        // Scripted client smoke test with screenshots: ./gradlew :fabric:runClientGametest
        clientGametest {
            client()
            setConfigName('Fabric Client Game Test')
            ideConfigGenerated(true)
            vmArg('-Dfabric.client.gametest')
            runDir('runs/clientGametest')
        }
        // Scripted showcase for README screenshots and videos: ./gradlew :fabric:runClientShowcase
        clientShowcase {
            client()
            setConfigName('Fabric Client Showcase')
            ideConfigGenerated(true)
            vmArg('-Dfabric.client.gametest')
            vmArg('-Dstonegolem.showcase')
            if (project.hasProperty('showcaseFrames')) {
                vmArg("-Dstonegolem.showcase.frames=${project.property('showcaseFrames')}")
            }
            runDir('runs/clientShowcase')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
